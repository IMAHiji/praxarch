image: node:22

stages:
  - verify
  - test

.node_pnpm:
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.8.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

typecheck:
  extends: .node_pnpm
  stage: verify
  script:
    - pnpm typecheck

lint:
  extends: .node_pnpm
  stage: verify
  script:
    - pnpm lint

build:
  extends: .node_pnpm
  stage: verify
  script:
    - pnpm build
  artifacts:
    paths:
      - dist
    expire_in: 1 hour

test:
  extends: .node_pnpm
  stage: test
  needs:
    - build
  timeout: 5m
  script:
    - pnpm test
