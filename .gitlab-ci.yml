image: node:22

stages:
  - verify
  - test

.node_pnpm:
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.8.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

typecheck:
  extends: .node_pnpm
  stage: verify
  script:
    - pnpm typecheck

lint:
  extends: .node_pnpm
  stage: verify
  script:
    - pnpm lint

build:
  extends: .node_pnpm
  stage: verify
  script:
    - pnpm build
  artifacts:
    paths:
      - dist
    expire_in: 1 hour

test:
  extends: .node_pnpm
  stage: test
  needs:
    - build
  timeout: 5m
  # Non-root: the default `image: node:22` (no `user:`) runs the whole pipeline as root, under
  # which permission-dependent tests (chmod 000 unreadability, etc.) can't reproduce a real
  # EACCES and silently skip instead of running -- a live defect in that code path would ship
  # green. `node` is the unprivileged user baked into the official node images.
  user: node
  script:
    - pnpm test
