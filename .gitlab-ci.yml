image: node:22

stages:
  - verify
  - test

.node_pnpm:
  before_script:
    # Corepack's default install directory (/usr/local/bin), deliberately -- an earlier revision
    # used `--install-directory "$HOME/.local/bin"` on the theory that before_script might run as
    # the `node` user. It does not: every job here runs as root (there is no `user:` key, and no
    # such job keyword exists in GitLab CI), and only the `test` job's `su node -c` drops privilege
    # for the test run itself. $HOME is therefore /root, which is mode 0700, so uid 1000 could not
    # traverse it and `su node -c "pnpm test"` died with `pnpm: command not found`, exit 127 --
    # zero tests executed in the one environment that runs them automatically.
    # /usr/local/bin is drwxr-xr-x, so the node user reaches pnpm there (verified live:
    # `docker run node:22-bookworm bash -c 'corepack enable && su node -c "command -v pnpm"'`).
    - corepack enable
    - corepack prepare pnpm@11.8.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

typecheck:
  extends: .node_pnpm
  stage: verify
  script:
    - pnpm typecheck

lint:
  extends: .node_pnpm
  stage: verify
  script:
    - pnpm lint

build:
  extends: .node_pnpm
  stage: verify
  script:
    - pnpm build
  artifacts:
    paths:
      - dist
    expire_in: 1 hour

test:
  extends: .node_pnpm
  stage: test
  # `pnpm test` itself (not before_script) runs as the node:22 image's unprivileged `node` user,
  # not the job's default of root: several tests (untracked.test.ts's mode-000 fixtures) reproduce
  # EACCES-shaped filesystem failures that root's DAC_OVERRIDE bypasses outright. Under root those
  # tests skip-guard themselves rather than fail for an unrelated reason -- correct locally, but it
  # means the only environment that runs this suite automatically would silently never exercise the
  # readable:false / "u:" key branches they cover. There is no `.gitlab-ci.yml` job keyword to pin
  # the container user (that's a runner `config.toml` setting, outside this repo), so `su node -c`
  # is the in-repo equivalent; install stays root (root-installed node_modules/pnpm-store are
  # world-readable by default, and switching users mid-job would need the node user to own the
  # pnpm store to write to it) and only the test run itself drops privilege.
  needs:
    - build
  timeout: 5m
  script:
    - su node -c "pnpm test"
