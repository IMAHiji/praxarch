image: node:22

stages:
  - verify
  - test

.node_pnpm:
  before_script:
    # `--install-directory` (rather than corepack's own default, /usr/local/bin) is required for
    # the `test` job below to work as a non-root user: `corepack enable` with no
    # `--install-directory` tries to symlink into /usr/local/bin, which EACCESes for anyone but
    # root (verified live: `docker run --user node node:22-bookworm corepack enable` fails this
    # way). $HOME is writable by whichever user the job actually runs as (root by default here,
    # `node` for the `test` job), so this one before_script works unmodified for both.
    - mkdir -p "$HOME/.local/bin"
    - corepack enable --install-directory "$HOME/.local/bin"
    - export PATH="$HOME/.local/bin:$PATH"
    - corepack prepare pnpm@11.8.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

typecheck:
  extends: .node_pnpm
  stage: verify
  script:
    - pnpm typecheck

lint:
  extends: .node_pnpm
  stage: verify
  script:
    - pnpm lint

build:
  extends: .node_pnpm
  stage: verify
  script:
    - pnpm build
  artifacts:
    paths:
      - dist
    expire_in: 1 hour

test:
  extends: .node_pnpm
  stage: test
  needs:
    - build
  timeout: 5m
  # Non-root: the default `image: node:22` (no `user:`) runs the whole pipeline as root, under
  # which permission-dependent tests (chmod 000 unreadability, etc.) can't reproduce a real
  # EACCES and silently skip instead of running -- a live defect in that code path would ship
  # green. `node` is the unprivileged user baked into the official node images.
  user: node
  script:
    - pnpm test
