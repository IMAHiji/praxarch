image: node:22

stages:
  - verify
  - test

.node_pnpm:
  before_script:
    # `--install-directory` (rather than corepack's own default, /usr/local/bin) is required for
    # the `test` job below to work as a non-root user: `corepack enable` with no
    # `--install-directory` tries to symlink into /usr/local/bin, which EACCESes for anyone but
    # root (verified live: `docker run --user node node:22-bookworm corepack enable` fails this
    # way). $HOME is writable by whichever user the job actually runs as (root by default here,
    # `node` for the `test` job), so this one before_script works unmodified for both.
    - mkdir -p "$HOME/.local/bin"
    - corepack enable --install-directory "$HOME/.local/bin"
    - export PATH="$HOME/.local/bin:$PATH"
    - corepack prepare pnpm@11.8.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

typecheck:
  extends: .node_pnpm
  stage: verify
  script:
    - pnpm typecheck

lint:
  extends: .node_pnpm
  stage: verify
  script:
    - pnpm lint

build:
  extends: .node_pnpm
  stage: verify
  script:
    - pnpm build
  artifacts:
    paths:
      - dist
    expire_in: 1 hour

test:
  extends: .node_pnpm
  stage: test
  # `pnpm test` itself (not before_script) runs as the node:22 image's unprivileged `node` user,
  # not the job's default of root: several tests (untracked.test.ts's mode-000 fixtures) reproduce
  # EACCES-shaped filesystem failures that root's DAC_OVERRIDE bypasses outright. Under root those
  # tests skip-guard themselves rather than fail for an unrelated reason -- correct locally, but it
  # means the only environment that runs this suite automatically would silently never exercise the
  # readable:false / "u:" key branches they cover. There is no `.gitlab-ci.yml` job keyword to pin
  # the container user (that's a runner `config.toml` setting, outside this repo), so `su node -c`
  # is the in-repo equivalent; install stays root (root-installed node_modules/pnpm-store are
  # world-readable by default, and switching users mid-job would need the node user to own the
  # pnpm store to write to it) and only the test run itself drops privilege.
  needs:
    - build
  timeout: 5m
  script:
    - su node -c "pnpm test"
